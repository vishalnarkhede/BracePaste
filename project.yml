name: JSONClipboardFormatter
options:
  bundleIdPrefix: com.vishalnarkhede
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  JSONClipboardFormatter:
    type: application
    platform: macOS
    sources:
      - path: JSONClipboardFormatter
        excludes:
          - Resources/Info.plist
    resources:
      - path: JSONClipboardFormatter/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishalnarkhede.BracePaste
        PRODUCT_NAME: BracePaste
        PRODUCT_MODULE_NAME: BracePaste
        INFOPLIST_FILE: JSONClipboardFormatter/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: JSONClipboardFormatter/JSONClipboardFormatter.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
    entitlements:
      path: JSONClipboardFormatter/JSONClipboardFormatter.entitlements
  JSONClipboardFormatterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - JSONClipboardFormatterTests
    dependencies:
      - target: JSONClipboardFormatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishalnarkhede.BracePasteTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BracePaste.app/Contents/MacOS/BracePaste"
        BUNDLE_LOADER: "$(TEST_HOST)"
  JSONClipboardFormatterUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - JSONClipboardFormatterUITests
    dependencies:
      - target: JSONClipboardFormatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishalnarkhede.BracePasteUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: JSONClipboardFormatter
schemes:
  JSONClipboardFormatter:
    build:
      targets:
        JSONClipboardFormatter: all
        JSONClipboardFormatterTests: [test]
        JSONClipboardFormatterUITests: [test]
    test:
      targets:
        - JSONClipboardFormatterTests
        - JSONClipboardFormatterUITests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
